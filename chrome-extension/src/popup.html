<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<body class="popup">
  <h1>Telugu Romanizer</h1>
  <label class="row"><input type="checkbox" id="enabled"> <span>Enabled</span></label>
  <div class="seg" id="scheme">
    <button data-scheme="iso">Project scheme<i>nēnu · kūḍā</i></button>
    <button data-scheme="colloquial">Colloquial<i>nenu · kooda</i></button>
  </div>
  <label class="row"><input type="checkbox" id="captions"> <span>Under video captions</span></label>
  <label class="row"><input type="checkbox" id="panel"> <span>In the side panel</span></label>
  <label class="row"><input type="checkbox" id="reader"> <span>In the Language&nbsp;Reactor reader</span></label>
  <label class="row"><input type="checkbox" id="hideScriptInPanel"> <span>Hide script in the panel</span></label>
  <label class="row" style="display:block">
    <span>Panel text size <b id="scaleval">100%</b></span>
    <input type="range" id="panelScale" min="60" max="100" step="5" style="width:100%;accent-color:#e8a33d">
  </label>
  <p class="hint">Turn this down if transcript lines are cut off.</p>
  <a class="opts" href="#" id="more">More settings</a>
  <script src="popup.js"></script>
</body>
