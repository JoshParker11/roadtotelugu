<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader | Road to Telugu</title>
<meta name="description" content="Telugu reading — the LingQ Mini Stories and An Intensive Course in Telugu, with click-a-word lookup and six-level word tracking.">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23191915'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23e8a33d'%3E%E0%B0%A4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+Telugu:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/reader.css">
</head>
<body>

<nav class="topbar">
  <a class="logo" href="../index.html" title="Back to the study desk"><span>త</span></a>
  <div class="topnav" id="topnav">
    <a href="#/" data-nav="read">Read</a>
    <a href="#/vocab" data-nav="vocab">Vocabulary</a>
    <a href="#/stats" data-nav="stats">Stats</a>
  </div>
  <div class="spacer"></div>
  <span class="streak" id="streak" title="Day streak"></span>
  <span class="goalring" id="goalring" title="Words acted on today"></span>
  <span class="knownchip" id="knownchip" title="Total words marked known, across every text">
    <span class="flag">తె</span><span id="knowntotal">0</span>
  </span>
  <span class="seg" id="romseg" title="How the Telugu is displayed">
    <button data-rom="coll" title="Chat romanization — how Telugu speakers actually type">abc</button>
    <button data-rom="iso" title="The project's literary scheme (ā ṭ ṇ …)">ābc</button>
    <button data-rom="te" class="te" title="Telugu script">తె</button>
  </span>
  <button class="iconbtn" id="kbd-help" title="Keyboard shortcuts (?)">⌨</button>
</nav>

<main id="main" class="withpanel"><div class="pane" id="pane"></div></main>

<aside class="panel" id="panel">
  <button class="panel-x" id="panel-x" aria-label="Close panel">×</button>
  <div id="panelbody"></div>
</aside>

<div class="playbar" id="playbar" hidden>
  <button class="pbtn big" id="pb-play" title="Play / pause (space)">▶</button>
  <button class="pbtn" id="pb-back" title="Back 5 seconds">↺5</button>
  <button class="pbtn" id="pb-fwd" title="Forward 5 seconds">5↻</button>
  <button class="pbtn" id="pb-loop" title="Loop this sentence (L)">∞</button>
  <button class="ratebtn" id="pb-rate" title="Playback speed">1×</button>
  <span class="clock" id="pb-elapsed">0:00</span>
  <input type="range" class="scrub" id="pb-scrub" min="0" max="100" step="0.1" value="0" aria-label="Seek">
  <span class="clock" id="pb-total">0:00</span>
</div>

<div class="toast" id="toast"></div>
<div id="overlay-root"></div>

<script src="../STUDY/assets/te2rom.js"></script>
<script src="../chrome-extension/src/colloquial.js"></script>
<script src="../STUDY/assets/progress.js"></script>
<script src="../GRAMMAR_LAB/data/verbs.js"></script>
<script src="../GRAMMAR_LAB/data/engine.js"></script>
<script src="data/ministories.js"></script>
<script src="data/intensive.js"></script>
<script src="assets/levels.js"></script>
<script src="assets/sync.js"></script>
<script src="assets/aidict.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
